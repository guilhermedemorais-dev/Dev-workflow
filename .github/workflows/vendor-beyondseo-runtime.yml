name: Vendor BeyondSEO Runtime

on:
  push:
    branches:
      - feat/seo-standard
    paths:
      - ".github/workflows/vendor-beyondseo-runtime.yml"
      - "plugins/seo-standard/runtime/runtime.lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-beyondseo-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seo-standard
          fetch-depth: 0

      - name: Download pinned BeyondSEO release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugins/seo-standard/vendor/beyondseo
          curl -fL             "https://github.com/beyondtahir/beyondseo/releases/download/v2.9.1/beyondseo-2.9.1-skill.zip"             -o plugins/seo-standard/vendor/beyondseo/beyondseo-2.9.1-skill.zip

      - name: Verify checksum and package contents
        shell: bash
        run: |
          set -euo pipefail
          FILE="plugins/seo-standard/vendor/beyondseo/beyondseo-2.9.1-skill.zip"
          EXPECTED="e9ab0e9e3a2ef46a9e3b3b3e4699b988fa256dcac91ef5e3539b49b850ac5010"
          ACTUAL="$(sha256sum "$FILE" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          unzip -l "$FILE" > plugins/seo-standard/vendor/beyondseo/PACKAGE-CONTENTS.txt
          unzip -p "$FILE" LICENSE > plugins/seo-standard/vendor/beyondseo/LICENSE 2>/dev/null || true

      - name: Commit vendored runtime
        shell: bash
        run: |
          set -euo pipefail
          git add plugins/seo-standard/vendor/beyondseo
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "vendor(seo): pin BeyondSEO 2.9.1 runtime [skip ci]"
          git push origin HEAD:feat/seo-standard
